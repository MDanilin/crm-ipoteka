function setMenu(open){nav.classList.toggle('open',open);bg.setAttribute('aria-expanded',open?'true':'false')}
bg.addEventListener('click',function(){setMenu(!nav.classList.contains('open'))});
sheet.addEventListener('click',function(e){if(e.target.closest('a'))setMenu(false)});

if('IntersectionObserver' in window){
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)} });
  },{threshold:.12,rootMargin:'0px 0px -40px'});
  document.querySelectorAll('.rv').forEach(function(el,i){el.style.transitionDelay=(i%4*60)+'ms';io.observe(el)});
}else{
  document.querySelectorAll('.rv').forEach(function(el){el.classList.add('in')});
}
})();
</script>
</body>
</html>
